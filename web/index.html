<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FuelPath">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Tu carga de carbohidratos antes de la carrera, comida a comida.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>FuelPath</title>
<link rel="icon" type="image/svg+xml" href="/icons/icono.svg">
<style>
  /* Mismos tokens que PacePath (web/index.html): sólo cambia el acento si se decide otra marca. */
  :root {
    --acento: #f2541b; --acento-osc: #c9410f; --tinta: #1d1d21; --suave: #6b6b75;
    --linea: #e6e6ea; --fondo: #ffffff; --gris: #f5f5f7; --ok: #1f9d55;
    --panel: #ffffff; --sombra: rgba(0,0,0,.10);
    --acento-claro: #fdeae2; --ok-claro: #e3f4ea; --ok-osc: #136b3a; --azul: #2a6fdb; --azul-claro: #e6effc;
    --azul-txt: #3a5a8c; --sal: #6b3fc4; --sal-claro: #f1e9ff; --sal-barra: #e3d7fb;
    --ambar: #9a6200; --ambar-claro: #fff1d6; --rojo: #b42323; --rojo-claro: #fde3e3;
    --banda: #cfeedd; --proy1: #f7b79b; --proy2: #fbd3c1; --lado: #fbfbfc;
  }
  body.noche { --tinta: #f4f4f6; --suave: #9a9aa6; --linea: #2a2a31; --gris: #22222a;
    --fondo: #141418; --panel: #141418; --sombra: rgba(0,0,0,.5);
    --acento-claro: #3a2016; --ok-claro: #173826; --ok-osc: #8fe0b2; --azul: #5b93f0; --azul-claro: #1b2740;
    --azul-txt: #a9c3ee; --sal: #b195f0; --sal-claro: #2a2140; --sal-barra: #3b3060;
    --ambar: #ffd28a; --ambar-claro: #3a2a10; --rojo: #ff9a9a; --rojo-claro: #3d1a1a;
    --banda: #1f4a33; --proy1: #8a4a2c; --proy2: #5a3020; --lado: #18181d; }
  @font-face { font-family: "PP Display"; src: url("/vendor/fuentes/InterDisplay-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "PP Display"; src: url("/vendor/fuentes/InterDisplay-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "PP Mono"; src: url("/vendor/fuentes/JetBrainsMono-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--fondo); color: var(--tinta);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body.bloq { overflow: hidden; }

  header { position: sticky; z-index: 10; top: 0; background: var(--panel);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom: 1px solid var(--linea); }
  .marca { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 19px; letter-spacing: -.3px; }
  .marca svg { width: 26px; height: 26px; }
  .marca .der { margin-left: auto; display: flex; gap: 6px; }
  .marca .der button { padding: 6px 10px; font-size: 13px; }

  main { padding: 14px 16px calc(env(safe-area-inset-bottom) + 96px); max-width: 640px; margin: 0 auto; }
  section[hidden] { display: none; }
  .tipo { color: var(--acento); font-weight: 800; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; }
  h2 { margin: 2px 0 6px; font-size: 22px; letter-spacing: -.3px; }
  h4 { margin: 18px 0 8px; font-size: 13px; color: var(--suave); text-transform: uppercase; letter-spacing: .5px; }
  .pista { color: var(--suave); margin: 4px 0 12px; font-size: 14px; }
  .aviso { background: #fff6e5; border-radius: 10px; padding: 9px 11px; color: #8a5a00; font-size: 13px; margin: 12px 0; }
  body.noche .aviso { background: #3a2a10; color: #ffd28a; }
  .aviso-ok { background: var(--ok-claro); border-radius: 10px; padding: 9px 11px; color: var(--ok-osc); font-size: 13px; margin: 12px 0; }
  .tarjeta { background: var(--gris); border-radius: 16px; padding: 14px; margin: 10px 0; }
  .tarjeta h3 { margin: 0 0 4px; font-size: 16px; }
  .tarjeta ul, ul.notas { margin: 6px 0 0; padding-left: 18px; color: var(--suave); font-size: 14px; }
  .grande { font-family: "PP Display", -apple-system, sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -1.5px; line-height: 1; }
  .grande small { font-size: 16px; letter-spacing: 0; color: var(--suave); font-weight: 600; }
  .mono { font-family: "PP Mono", ui-monospace, monospace; font-weight: 700; }
  .barra { height: 10px; border-radius: 5px; background: var(--linea); overflow: hidden; margin: 10px 0 4px; }
  .barra i { display: block; height: 100%; background: var(--acento); border-radius: 5px; transition: width .3s; }
  .barra.fina { height: 6px; margin: 6px 0 2px; }

  form, .form { display: grid; gap: 10px; }
  .fila { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
  label { display: grid; gap: 4px; font-size: 12px; font-weight: 700; color: var(--suave); }
  /* 16 px: con menos, Safari iOS hace zoom al enfocar. */
  input, select { font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 12px; min-width: 0; width: 100%;
    border: 1px solid var(--linea); background: var(--gris); color: var(--tinta); min-height: 46px; }
  input:focus, select:focus { outline: 2px solid #f7c5b2; background: var(--panel); }
  button { font: inherit; font-size: 16px; border: 0; border-radius: 12px; padding: 11px 16px;
    font-weight: 700; background: var(--acento); color: #fff; cursor: pointer; white-space: nowrap; }
  button:active { background: var(--acento-osc); }
  button.sec { background: var(--gris); color: var(--tinta); border: 1px solid var(--linea); }
  button.sec:active { background: var(--linea); }
  button:disabled { opacity: .45; cursor: default; }
  button.chico { padding: 9px 12px; font-size: 15px; }
  .botones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .botones > button { flex: 1; }
  .seg { display: flex; background: var(--gris); border: 1px solid var(--linea); border-radius: 12px; padding: 3px; gap: 3px; min-height: 46px; }
  .seg button { flex: 1; padding: 8px 4px; border-radius: 9px; font-size: 15px; font-weight: 600; color: var(--suave); background: transparent; }
  .seg button.on { background: var(--panel); color: var(--tinta); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .opciones { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
  .op { border: 1.5px solid var(--linea); border-radius: 14px; padding: 10px 6px; text-align: center; background: var(--panel); color: var(--tinta); }
  .op b { display: block; font-family: "PP Display"; font-size: 24px; letter-spacing: -.5px; }
  .op small { display: block; font-size: 11px; color: var(--suave); font-weight: 600; white-space: normal; }
  .op .g { font-size: 13px; font-weight: 700; margin-top: 4px; }
  .op.on { border-color: var(--acento); background: var(--acento-claro); }
  .op.on small.et { color: var(--acento); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 12px; border-radius: 20px; background: var(--gris); border: 1px solid var(--linea); font-size: 14px; font-weight: 600; color: var(--tinta); }
  .chip.on { background: var(--tinta); color: var(--fondo); border-color: var(--tinta); }
  .interruptor { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 15px; font-weight: 600;
    color: var(--tinta); padding: 10px 0; border-bottom: 1px solid var(--linea); cursor: pointer; }
  .interruptor small { display: block; font-weight: 400; color: var(--suave); font-size: 13px; }
  .interruptor input { position: absolute; opacity: 0; width: 1px; height: 1px; min-height: 0; }
  .sw { width: 46px; height: 28px; border-radius: 14px; background: var(--linea); position: relative; flex: none; transition: background .2s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .2s; }
  .interruptor input:checked + .sw { background: var(--ok); }
  .interruptor input:checked + .sw::after { left: 21px; }
  .interruptor input:focus-visible + .sw { outline: 2px solid #f7c5b2; }

  /* Lista de alimentos */
  .alim { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linea); cursor: pointer; }
  .alim:last-child { border-bottom: 0; }
  .alim .txt { flex: 1; min-width: 0; }
  .alim .txt b { display: block; font-size: 15px; }
  .alim .txt small { color: var(--suave); font-size: 13px; }
  .alim .g { font-family: "PP Mono"; font-size: 14px; }
  .tick { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--linea); flex: none; display: grid; place-items: center;
    font-size: 15px; font-weight: 800; color: #fff; background: var(--panel); }
  .tick.on { background: var(--acento); border-color: var(--acento); }
  .alim.no { cursor: default; } .alim.no b { text-decoration: line-through; color: var(--suave); }
  .alim.no .tick { background: var(--gris); }
  .etq { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--azul-claro); color: var(--azul); margin-left: 4px; vertical-align: 1px; }
  .etq.gris { background: var(--linea); color: var(--suave); }
  .etq.sal { background: var(--sal-claro); color: var(--sal); }

  /* Agenda */
  .dias { display: flex; gap: 8px; margin: 10px 0 4px; }
  .dia { flex: 1; text-align: center; border-radius: 12px; padding: 7px 4px; background: var(--gris); font-size: 12px; font-weight: 700; color: var(--suave); }
  .dia b { display: block; font-size: 15px; color: var(--tinta); }
  .dia.on { background: var(--tinta); color: var(--linea); } .dia.on b { color: var(--fondo); }
  .dia .ok { color: var(--ok); }
  .usa { display: flex; align-items: center; gap: 10px; background: var(--gris); border-radius: 14px; padding: 10px 12px; margin: 10px 0; font-size: 13px; }
  .usa div { flex: 1; min-width: 0; color: var(--suave); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .usa div b { color: var(--tinta); }
  .kpi { background: var(--gris); border-radius: 16px; padding: 14px; margin: 10px 0; }
  .kpi .fila-k { display: flex; align-items: baseline; gap: 8px; }
  .estado { margin-left: auto; font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 8px; white-space: nowrap; }
  .estado.bajo { background: var(--ambar-claro); color: var(--ambar); }
  .estado.ok { background: var(--ok-claro); color: var(--ok-osc); }
  .estado.sobre { background: var(--rojo-claro); color: var(--rojo); }
  .rango { position: relative; height: 12px; border-radius: 6px; background: var(--linea); margin: 14px 0 6px; }
  .rango .banda { position: absolute; top: 0; bottom: 0; background: var(--banda); }
  .rango .hecho { position: absolute; left: 0; top: 0; bottom: 0; background: var(--acento); border-radius: 6px 0 0 6px; }
  .rango .proy { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, var(--proy1) 0 4px, var(--proy2) 4px 8px); }
  .rango .marca { position: absolute; top: -5px; width: 3px; height: 22px; margin-left: -1px; background: var(--tinta); border-radius: 2px; }
  .rango .marca.ok { background: var(--ok); } .rango .marca.bajo { background: var(--ambar); }
  .escala { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--suave); font-family: "PP Mono"; }
  .ley { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--suave); margin-top: 6px; }
  .ley i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .mini { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-top: 10px; }
  .mini > div { background: var(--panel); border-radius: 12px; padding: 8px 10px; }
  .mini small { display: block; font-size: 11px; font-weight: 700; color: var(--suave); text-transform: uppercase; }
  .mini b { font-family: "PP Display"; font-size: 18px; }
  .mini span { font-size: 12px; color: var(--suave); }
  .mini .sal small { color: var(--sal); }
  .agua { background: var(--azul-claro); border-radius: 16px; padding: 12px 14px; margin: 10px 0; }
  .agua .cab-a { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .agua .cab-a b { font-size: 16px; }
  .agua .cab-a .der { margin-left: auto; font-family: "PP Mono"; font-size: 14px; color: var(--azul); }
  .agua .pista { margin: 0; font-size: 13px; color: var(--azul-txt); }
  .vasos { display: flex; gap: 6px; margin: 10px 0 8px; flex-wrap: wrap; }
  .vasos svg { width: 24px; height: 28px; flex: none; }
  .agua .fila-a { display: flex; align-items: center; gap: 8px; }
  .agua .fila-a .pista { flex: 1; }
  .agua button { background: var(--azul); }
  .agua button.sec { background: var(--panel); color: var(--azul); border-color: transparent; }

  .comida { background: var(--gris); border-radius: 16px; padding: 12px 14px; margin: 10px 0; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .comida .anillo { width: 44px; height: 44px; flex: none; }
  .comida .txt { flex: 1; min-width: 0; }
  .comida .txt b { font-size: 16px; }
  .comida .txt small { display: block; color: var(--suave); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comida .txt small.ahora { color: var(--acento); font-weight: 700; }
  .comida .der { text-align: right; font-family: "PP Mono"; font-size: 13px; color: var(--suave); white-space: nowrap; }
  .comida .der b { display: block; color: var(--tinta); font-size: 15px; }
  .comida.abierta { display: block; background: var(--panel); border: 1.5px solid var(--acento); cursor: default; }
  .comida.abierta .fila-cab { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; cursor: pointer; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linea); }
  .item:last-of-type { border-bottom: 0; }
  .item.editado { background: var(--acento-claro); margin: 0 -14px; padding: 10px 14px; border-bottom-color: transparent; }
  .ck { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #c8c8d0; flex: none; display: grid; place-items: center;
    font-size: 14px; font-weight: 800; color: transparent; background: transparent; padding: 0; }
  .ck.si { background: var(--ok); border-color: var(--ok); color: #fff; }
  .ck.medio { border-color: var(--ok); background: linear-gradient(90deg, var(--ok) 50%, transparent 50%); color: #fff; }
  .ck.no { background: var(--linea); border-color: var(--linea); color: var(--suave); }
  .item .col { flex: 1; min-width: 0; display: grid; gap: 6px; justify-items: start; }
  .item .txt { font-size: 14px; }
  .item .txt b { font-size: 15px; }
  .item .txt small { display: block; color: var(--suave); font-size: 12px; }
  .item .txt small.cambio { color: var(--acento); font-weight: 700; }
  .item .g { font-family: "PP Mono"; font-size: 13px; white-space: nowrap; }
  .item .mas { background: transparent; color: var(--suave); font-size: 18px; padding: 6px 4px; letter-spacing: -1px; }
  .paso { display: inline-flex; align-items: center; border: 1px solid var(--linea); border-radius: 10px; background: var(--panel); overflow: hidden; flex: none; }
  .paso button { width: 40px; height: 36px; padding: 0; border-radius: 0; font-size: 20px; font-weight: 700; color: var(--acento); background: transparent; }
  .paso b { min-width: 86px; padding: 0 6px; text-align: center; font-size: 14px; border-left: 1px solid var(--linea); border-right: 1px solid var(--linea); line-height: 36px; white-space: nowrap; }
  .marcar { display: flex; gap: 8px; margin-top: 8px; }
  .marcar button { flex: 1; padding: 10px 6px; font-size: 15px; }

  .trio { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
  .trio > div { background: var(--gris); border-radius: 14px; padding: 10px; }
  .trio small { display: block; font-size: 11px; font-weight: 700; color: var(--suave); text-transform: uppercase; }
  .trio b { font-family: "PP Display"; font-size: 20px; letter-spacing: -.5px; }
  .trio span { font-size: 12px; color: var(--suave); }
  .trio > div.sal { background: var(--sal-claro); } .trio > div.sal small { color: var(--sal); }
  .gel { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--linea); font-size: 14px; }
  .gel:last-child { border-bottom: 0; }
  .gel .mono { min-width: 52px; color: var(--acento); }
  .gel .km { margin-left: auto; font-family: "PP Mono"; color: var(--suave); font-size: 13px; }
  .linea-t { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--linea); }
  .linea-t:last-child { border-bottom: 0; }
  .linea-t .mono { min-width: 52px; color: var(--acento); padding-top: 1px; }
  .linea-t .txt { flex: 1; font-size: 14px; } .linea-t .txt b { font-size: 15px; }
  .linea-t .txt small { display: block; color: var(--suave); font-size: 13px; }

  /* Hoja (abajo) y pantalla de ajuste */
  .velo { position: fixed; inset: 0; background: rgba(20,20,24,.45); z-index: 30; }
  .hoja { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--panel); border-radius: 22px 22px 0 0;
    padding: 10px 16px calc(env(safe-area-inset-bottom) + 18px); max-height: 88vh; overflow-y: auto; }
  .asa { width: 40px; height: 5px; border-radius: 3px; background: var(--linea); margin: 0 auto 12px; }
  .comparar { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; margin: 10px 0; }
  .comparar > div { border: 1.5px solid var(--linea); border-radius: 14px; padding: 10px; }
  .comparar > div.on { border-color: var(--ok); background: var(--ok-claro); }
  .comparar small { display: block; font-size: 11px; font-weight: 700; color: var(--suave); text-transform: uppercase; }
  .hoja .botones.fijos { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom)); background: var(--panel); margin: 12px -16px 0;
    padding: 10px 16px calc(env(safe-area-inset-bottom) + 12px); border-top: 1px solid var(--linea); }
  .comparar b { font-family: "PP Display"; font-size: 26px; letter-spacing: -.6px; display: block; line-height: 1.1; margin: 2px 0 6px; }
  .comparar .estado { margin-left: 0; display: inline-block; }
  .cambios { background: var(--gris); border-radius: 14px; padding: 2px 12px; }
  .reparto { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--linea); font-size: 14px; }
  .reparto:last-child { border-bottom: 0; }
  .reparto .txt { flex: 1; min-width: 0; } .reparto .txt small { display: block; color: var(--suave); font-size: 12px; }
  .reparto .mono { color: var(--ok); white-space: nowrap; } .reparto .mono.menos { color: var(--ambar); }
  .tope { font-size: 11px; font-weight: 700; color: var(--suave); background: var(--linea); border-radius: 6px; padding: 2px 6px; }
  .agregar { display: block; width: 100%; margin-top: 8px; background: transparent; color: var(--acento); border: 1.5px dashed var(--linea); font-size: 15px; }
  .agr-lista button { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; background: transparent; color: var(--tinta);
    border-radius: 0; border-bottom: 1px solid var(--linea); padding: 12px 2px; font-weight: 600; white-space: normal; }
  .agr-lista button small { margin-left: auto; color: var(--suave); font-weight: 400; font-size: 13px; white-space: nowrap; }
  .agr-lista button.otro { color: var(--acento); border-bottom: 0; }
  .agr-sel { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
  .agr-sel .grande { font-size: 32px; }
  .alts { display: flex; gap: 8px; overflow-x: auto; margin: 6px -16px; padding: 0 16px 4px; scrollbar-width: none; }
  .alts button { flex: none; width: 140px; text-align: left; white-space: normal; background: var(--gris); color: var(--tinta); border: 1px solid var(--linea);
    border-radius: 14px; padding: 10px; font-size: 13px; font-weight: 400; }
  .alts button b { display: block; font-size: 14px; }
  .alts button .mono { color: var(--acento); font-size: 13px; }
  .destinos button { display: flex; width: 100%; justify-content: space-between; flex-wrap: wrap; gap: 2px 8px; margin: 6px 0; background: var(--gris); color: var(--tinta);
    border: 1px solid var(--linea); font-weight: 600; white-space: normal; text-align: left; }

function minutos(txt) {           // «3:30» → 210 · «11:45» → 705 · «45:00» → 45 · «45» → 45
  const p = String(txt).trim().split(/[:.,h]/).filter((x) => x !== "").map(Number);

  const carga = p.dias.filter((d) => d.tipo === "carga"), dc = p.dias[p.dias.length - 1];
  const obj = carga.reduce((s, d) => s + d.objetivo_g, 0), hecho = carga.reduce((s, d) => s + gHecho(d), 0);
  const dcObj = dc.comidas.reduce((s, cm) => s + gPlan(cm), 0);
  return { total: obj ? Math.round(hecho / obj * 100) : null, carrera: dcObj ? Math.round(gHecho(dc) / dcObj * 100) : null,
    dias: carga.map((d) => ({ fecha: d.fecha, hecho: Math.round(gHecho(d)), objetivo: d.objetivo_g, pct: Math.round(gHecho(d) / d.objetivo_g * 100) })) };
}
const FB = {
  energia: [N("Energía en carrera"), [["bien", N("Con energía hasta el final")], ["bajon", N("Bajón al final")], ["sin", N("Me quedé sin energía")]]],
  estomago: [N("Estómago"), [["bien", N("Bien")], ["leve", N("Molestias leves")], ["mal", N("Problemas")]]],
  carga: [N("La carga"), [["bien", N("Cómoda")], ["pesada", N("Me sentí pesado")], ["hambre", N("Me quedé con hambre")]]],
};
const etFb = (k, v) => t(FB[k][1].find(([x]) => x === v)?.[1] || "");
function finHtml() {
  const c = cumplimiento(plan);
  return `<div class="fin"><span class="tipo">${nombreEvento()} · ${t("ya pasó")}</span><h3>${t("¿Cómo te fue?")}</h3>
    <p class="pista" style="margin-bottom:4px">${c.total != null ? t("Cumpliste el {x}% de la carga.", { x: c.total }) + " " : ""}${t("Cuéntanos cómo te sentiste: queda guardado para la próxima.")}</p>
    ${Object.entries(FB).map(([k, [titulo, ops]]) => `<h4 style="margin:12px 0 2px">${t(titulo)}</h4><div class="chips">${ops.map(([v, et]) =>
      `<button type="button" class="chip${fb[k] === v ? " on" : ""}" data-acc="fb" data-k="${k}" data-v="${v}">${t(et)}</button>`).join("")}</div>`).join("")}
    <div class="fila"><label>${t("Tiempo final (opcional)")}<input data-fb="tiempo" value="${esc(fb.tiempo || "")}" placeholder="3:05" inputmode="numeric" autocomplete="off"></label><span></span></div>
    <label>${t("¿Qué cambiarías la próxima vez?")}<input data-fb="nota" value="${esc(fb.nota || "")}" maxlength="300" autocomplete="off"></label>
    <div class="botones"><button type="button" data-acc="archivar">${t("Guardar y cerrar el plan")}</button></div></div>`;
}
function archivar() {
  const h = { id: Date.now(), guardado: new Date().toISOString(), evento: plan.evento, distancia: plan.distancia, fecha: plan.fecha,
    regimen: plan.regimen, peso_kg: plan.peso_kg, tiempo_min: plan.tiempo_min, cumplimiento: cumplimiento(plan),
    feedback: { ...fb, tiempo: fb.tiempo ? minutos(fb.tiempo) : null }, perfil: structuredClone(perfil), plan };
  historial = [h, ...historial].slice(0, 20); guardar("fp_historial", historial);
  for (const d of plan.dias) delete agua[d.fecha];
  guardar("fp_agua", agua);
  plan = null; borrarClave("fp_plan"); fb = {}; diaSel = null; abierta = {};
  if (perfil) { perfil.fecha = ""; guardar("fp_perfil", perfil); }
  aviso(t("Guardado en tus planes anteriores."));
  cambiarVista("hoy");
}
function pasadoHtml(h) {
  const c = h.cumplimiento, f = h.feedback || {};
  const resumen = [f.energia && etFb("energia", f.energia), f.estomago && etFb("estomago", f.estomago)].filter(Boolean).join(" · ");
  return `<div class="pasado" data-acc="ver-pasado" data-id="${h.id}"><div class="txt"><b>${esc(h.evento || t(DIST[h.distancia]?.n || ""))}</b>
    <small>${esc(fechaLarga(h.fecha))}${h.regimen ? ` · ${fmt(h.regimen, 1)} g/kg` : ""}</small>${resumen ? `<small>${esc(resumen)}</small>` : ""}</div>
    ${c.total != null ? `<span class="pct">${c.total}%</span>` : ""}</div>`;
}
function historialHtml(max = 99) {
  if (!historial.length) return "";
  return `<h4>${t("Planes anteriores")}</h4>${historial.slice(0, max).map(pasadoHtml).join("")}
    ${historial.length > max ? `<div class="botones"><button type="button" class="sec" data-acc="ir-perfil">${t("Ver todos")}</button></div>` : ""}`;
}
function consejos(h) {
  const c = h.cumplimiento.total, f = h.feedback || {}, out = [];
  if (c != null && c < 90 && (f.energia === "bajon" || f.energia === "sin"))
    out.push(t("Llegaste al {x}% de la carga y te faltó energía: la próxima vez apunta a cumplirla completa.", { x: c }));
  else if (f.energia === "sin" || f.energia === "bajon")
    out.push(t("Cumpliste la carga y aun así te faltó energía al final: revisa los carbohidratos en carrera y pruébalos en tus fondos."));
  if (f.estomago === "leve" || f.estomago === "mal")
    out.push(t("Para el estómago: marca «estómago sensible», baja la fibra y prueba el desayuno y los geles en tus fondos."));
  if (f.carga === "pesada") out.push(t("Si te sentiste pesado, prueba el régimen conservador o más líquidos con carbohidratos."));
  if (f.carga === "hambre") out.push(t("Si te quedaste con hambre y lo toleraste bien, puedes probar un régimen más alto."));
  if (f.energia === "bien" && f.estomago === "bien") out.push(t("Te funcionó: repite este plan en tu próxima carrera."));
  return out;
}
function abrirPasado(id) {
  const h = historial.find((x) => x.id === id); if (!h) return;
  const c = h.cumplimiento, f = h.feedback || {};
  abrirHoja(`<span class="tipo">${t("Plan anterior")}</span><h2 style="font-size:20px">${esc(h.evento || t(DIST[h.distancia]?.n || ""))}</h2>
    <p class="pista">${esc(fechaLarga(h.fecha))} · ${esc(t(DIST[h.distancia]?.n || ""))}${h.regimen ? ` · ${fmt(h.regimen, 1)} g/kg` : ""} · ${fmt(h.peso_kg, 1)} kg</p>
    <div class="cambios">
      ${c.total != null ? `<div class="dato"><span>${t("Carga cumplida")}</span><span>${c.total}%</span></div>` : ""}
      ${c.dias.map((d) => `<div class="dato"><span>${esc(diaLargo(d.fecha))}</span><span>${fmt(d.hecho)} ${t("de {g} g", { g: fmt(d.objetivo) })}</span></div>`).join("")}
      ${c.carrera != null ? `<div class="dato"><span>${t("Antes de largar")}</span><span>${c.carrera}%</span></div>` : ""}
      ${Object.keys(FB).filter((k) => f[k]).map((k) => `<div class="dato"><span>${t(FB[k][0])}</span><span>${etFb(k, f[k])}</span></div>`).join("")}
      ${f.tiempo ? `<div class="dato"><span>${t("Tiempo final")}</span><span>${hm(f.tiempo)}</span></div>` : ""}
    </div>
    ${f.nota ? `<p class="pista">«${esc(f.nota)}»</p>` : ""}
    ${consejos(h).length ? `<h4>${t("Para la próxima")}</h4><ul class="notas">${consejos(h).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <div class="botones fijos"><button type="button" class="sec" data-acc="borrar-pasado" data-id="${h.id}">${t("Borrar")}</button>
      <button type="button" data-acc="reusar" data-id="${h.id}">${t("Usar como base")}</button></div>`);
}

// ── Vistas ────────────────────────────────────────────────────────────────
function sinPauta() {
  return `<span class="tipo">FuelPath</span><h2>${t("Aún no tienes pauta")}</h2>
    <p class="pista">${t("Con tu carrera, tu peso y tus horarios armamos la carga de carbohidratos comida a comida.")}</p>
    <div class="botones"><button type="button" data-acc="ir-pauta">${t("Armar mi pauta")}</button></div>
    ${historialHtml(3)}`;
}

function anillo(cm) {
  if (completa(cm)) return `<svg class="anillo" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--ok)" stroke-width="5"/>
    <path d="M15 22l5 5 9-10" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const plan_g = gPlan(cm), f = plan_g ? Math.min(1, gComido(cm) / plan_g) : (marcada(cm) ? 1 : 0), L = 113.1;
  return `<svg class="anillo" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--linea)" stroke-width="5"/>
    ${f > 0 ? `<circle cx="22" cy="22" r="18" fill="none" stroke="var(--acento)" stroke-width="5" stroke-dasharray="${(f * L).toFixed(1)} ${L}" transform="rotate(-90 22 22)" stroke-linecap="round"/>` : ""}</svg>`;
}

function rangoHtml(d, total, hecho, marcas = []) {
  const r = d.rango_g, E = Math.max(r[1] * 1.13, total * 1.04, 1), p = (x) => Math.max(0, Math.min(100, x / E * 100)).toFixed(1);
  return `<div class="rango"><div class="banda" style="left:${p(r[0])}%;width:${(p(r[1]) - p(r[0])).toFixed(1)}%"></div>
    ${total > hecho ? `<div class="proy" style="left:${p(hecho)}%;width:${(p(total) - p(hecho)).toFixed(1)}%"></div>` : ""}
    <div class="hecho" style="width:${p(Math.min(hecho, total))}%"></div>
    ${(marcas.length ? marcas : [{ g: d.objetivo_g, c: "" }]).map((m) => `<div class="marca ${m.c}" style="left:${p(m.g)}%"></div>`).join("")}</div>`;
}

function kpiHtml(di, d) {
  const hecho = gHecho(d), proy = gProy(d);
  if (d.tipo === "carrera") {
    const obj = d.comidas.reduce((s, cm) => s + gPlan(cm), 0);
    return `<div class="kpi"><span class="tipo" style="color:var(--suave)">${t("Antes de largar")}</span>
      <div class="grande" style="margin-top:6px">${fmt(hecho)} <small>${t("de {g} g", { g: fmt(obj) })}</small></div>
      <div class="barra"><i style="width:${obj ? Math.min(100, hecho / obj * 100).toFixed(0) : 0}%"></i></div>
      <div class="botones"><button type="button" class="sec chico" data-acc="ir-carrera">${t("Plan en carrera")} →</button></div></div>`;
  }
  const est = estadoDe(proy, d.rango_g), quedan = d.comidas.some((cm) => !marcada(cm));
  return `<div class="kpi">
    <div class="fila-k"><span class="tipo" style="color:var(--suave)">${t("Carga del día")}</span><span class="estado ${est}">${t(ESTADOS[est])}</span></div>
    <div class="grande" style="margin-top:6px">${fmt(hecho)} <small>${t("hecho")} · ${t("va a quedar en {g} g", { g: fmt(proy) })}</small></div>
    ${rangoHtml(d, proy, hecho)}
    <div class="escala"><span>0</span><span>${t("rango {a}–{b} · objetivo {o}", { a: fmt(d.rango_g[0]), b: fmt(d.rango_g[1]), o: fmt(d.objetivo_g) })}</span></div>
    <div class="ley"><span><i style="background:var(--acento)"></i>${t("Hecho")}</span><span><i style="background:var(--proy1)"></i>${t("Lo que queda")}</span>
      <span><i style="background:var(--banda)"></i>${t("Rango")}</span><span><i style="background:var(--tinta);width:3px"></i>${t("Objetivo")}</span></div>
    <div class="mini">
      <div class="sal"><small>${t("Sodio")}</small><b>${kg(naHecho(d))}</b> <span>${t("de {g} g", { g: kg(d.sodio_mg) })}</span>
        <div class="barra fina" style="background:var(--sal-barra)"><i style="width:${Math.min(100, naHecho(d) / d.sodio_mg * 100).toFixed(0)}%;background:var(--sal)"></i></div></div>
      <div><small>${t("Por kilo")}</small><b>${fmt(proy / plan.peso_kg, 1)}</b> <span>${t("g/kg proyectado")}</span></div>

}

const VASO = (lleno) => `<svg viewBox="0 0 26 30" aria-hidden="true"><path d="M4 3h18l-2.5 24h-13z" fill="${lleno ? "var(--azul)" : "none"}" stroke="var(--azul)" stroke-opacity="${lleno ? 1 : .45}" stroke-width="2" stroke-linejoin="round"/></svg>`;
function aguaHtml(d) {
  if (!d.agua_ml) return "";
  const total = Math.round(d.agua_ml / 250), n = agua[d.fecha] || 0;
  return `<div class="agua"><div class="cab-a"><b>${t("Agua")}</b><span class="pista">${t("aparte de jugos e isotónica")}</span>
      <span class="der">${kg(n * 250)} ${t("de {g}", { g: kg(d.agua_ml) })} L</span></div>
    <div class="vasos">${Array.from({ length: Math.max(total, n) }, (_, i) => VASO(i < n)).join("")}</div>
    <div class="fila-a"><span class="pista">${t("1 vaso = 250 ml. Orina clara: vas bien.")}</span>

      <button type="button" class="chico" data-acc="agua" data-n="1">${t("+ 1 vaso")}</button></div></div>`;

function itemHtml(di, ci, ii, it, d) {
  const a = A(it.a); if (!a) return "";
  const marcado = it.c != null, n = it.c ?? it.v ?? it.p, cambiado = (it.c ?? it.v ?? it.p) !== it.p;
  const ck = !marcado ? "" : it.c === 0 ? "no" : it.c < it.p ? "medio" : "si";
  const dg = gIt(it, n) - gIt(it);
  const nota = cambiado && a.cho > 0 ? `<small class="cambio">${t("Plan: {q} · {g} g", { q: cantidad(a, it.p), g: (dg > 0 ? "+" : "−") + fmt(Math.abs(dg)) })}</small>` : "";

  return `<div class="item${cambiado ? " editado" : ""}">
    <button type="button" class="ck ${ck}" data-acc="marcar" data-d="${di}" data-c="${ci}" data-i="${ii}" aria-label="${t("Marcar")}">${ck === "no" ? "✕" : "✓"}</button>
    <div class="col"><div class="txt">${editable ? `<b>${esc(a.nombre)}</b>` : `<b>${cantidad(a, n)}</b> · ${esc(a.nombre)}`}${nota}</div>
      ${editable ? `<div class="paso"><button type="button" data-acc="menos" data-d="${di}" data-c="${ci}" data-i="${ii}" aria-label="${t("Menos")}" ${n <= 0 ? "disabled" : ""}>−</button>
        <b>${cantidad(a, n)}</b><button type="button" data-acc="mas" data-d="${di}" data-c="${ci}" data-i="${ii}" aria-label="${t("Más")}" ${n + a.paso > maximo(a, d.escala, it) + 1e-6 ? "disabled" : ""}>+</button></div>` : ""}</div>
    <span class="g">${gTexto(it, n)}</span>
    ${!marcado && d.tipo !== "carrera" ? `<button type="button" class="mas" data-acc="opciones" data-d="${di}" data-c="${ci}" data-i="${ii}" aria-label="${t("Más opciones")}">⋯</button>` : ""}</div>`;
}

function comidaHtml(di, ci, cm, d, ahora) {
  const nombres = cm.items.map((it) => A(it.a)?.nombre.toLowerCase()).filter(Boolean).join(", ");
  const plan_g = gPlan(cm), na = cm.items.reduce((s, it) => s + it.p * (A(it.a)?.sodio || 0), 0);
  const der = plan_g > 0 ? (marcada(cm) ? `<b>${fmt(gComido(cm))} g</b>${t("de {g}", { g: fmt(plan_g) })}` : `<b>${fmt(plan_g)} g</b>${t("{n} ítems", { n: cm.items.length })}`)
    : `<b>${fmt(na)} mg</b>`;
  const sub = ci === ahora ? `<small class="ahora">${t("AHORA")} · ${cm.hora}</small>` : `<small>${cm.hora} · ${esc(nombres)}</small>`;
  if (abierta[di] !== ci) return `<div class="comida" data-acc="abrir" data-d="${di}" data-c="${ci}">${anillo(cm)}
      <div class="txt"><b>${nombreComida(cm)}</b>${sub}</div><div class="der">${der}</div></div>`;
  const pendientes = cm.items.some((it) => it.c == null);
  return `<div class="comida abierta"><div class="fila-cab" data-acc="abrir" data-d="${di}" data-c="${ci}">${anillo(cm)}
      <div class="txt"><b style="font-size:17px">${nombreComida(cm)}</b>${ci === ahora ? sub : `<small>${cm.hora}</small>`}</div><div class="der">${der}</div></div>
    ${cm.items.map((it, ii) => itemHtml(di, ci, ii, it, d)).join("")}
    <button type="button" class="agregar" data-acc="agregar" data-d="${di}" data-c="${ci}">+ ${t("Agregar")}</button>
    ${pendientes ? `<div class="marcar"><button type="button" class="sec" data-acc="todo" data-d="${di}" data-c="${ci}">${t("✓ Todo")}</button>
      <button type="button" class="sec" data-acc="medias" data-d="${di}" data-c="${ci}">${t("A medias")}</button>
      <button type="button" class="sec" data-acc="nada" data-d="${di}" data-c="${ci}">${t("✕ No")}</button></div>` : ""}</div>`;
}

function pintarHoy() {
  if (!plan) return $("hoy").innerHTML = sinPauta();
  if (!cat || cat.lang !== idioma) { cargarCatalogo(perfil?.restricciones || [], perfil?.estomago_sensible).then(pintarHoy).catch(() => {}); if (!cat) return; }
  if (diaSel == null || !plan.dias[diaSel]) diaSel = diaPorDefecto();
  const di = diaSel, d = plan.dias[di], esHoy = d.fecha === hoyISO();
  const ahora = esHoy ? d.comidas.findIndex((cm) => !completa(cm)) : -1;
  if (!(di in abierta)) abierta[di] = ahora;
  const titulo = d.tipo === "carrera" ? t("{d}: día de carrera", { d: diaLargo(d.fecha) })
    : t("{d}: día de carga {n} de {de}", { d: diaLargo(d.fecha), n: d.n, de: d.de });
  const usa = plan.elegidos.map((id) => A(id)?.nombre).filter(Boolean);
  $("hoy").innerHTML = `${termino() ? finHtml() : ""}<span class="tipo">${nombreEvento()} · ${faltan()}</span><h2>${titulo}</h2>
    <div class="dias">${plan.dias.map((x, i) => `<button type="button" class="dia${i === di ? " on" : ""}" data-acc="dia" data-d="${i}">${esc(diaCorto(x.fecha))}
      <b>${diaNum(x.fecha)}${x.comidas.every(completa) ? ' <span class="ok">✓</span>' : ""}</b></button>`).join("")}</div>
    <div class="hoy-grid"><div class="lado">${kpiHtml(di, d)}${aguaHtml(d)}
      <div class="usa"><div><b>${t("Tu pauta usa:")}</b> ${esc(usa.join(", ").toLowerCase())}</div>
        <button type="button" class="sec chico" data-acc="ir-alimentos">✎ ${t("Cambiar")}</button></div></div>
    <div class="centro"><h4>${t("Comidas")}</h4><div class="comidas">${d.comidas.map((cm, ci) => comidaHtml(di, ci, cm, d, ahora)).join("")}</div>
      ${d.notas?.length ? `<ul class="notas">${d.notas.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${plan.notas.map((x) => `<p class="aviso">${esc(x)}</p>`).join("")}</div></div>`;
}

// ── Marcar, ajustar y recalcular ────────────────────────────────────────────
function refrescar() { guardarPlan(); pintarHoy(); }
async function proponer(di, ci, titulo) {
  const d = plan.dias[di];
  if (!d.reparto) return;
  abrirHoja(`<span class="tipo">${nombreComida(d.comidas[ci])}</span><h2 style="font-size:20px">${esc(titulo)}</h2><p class="pista">${t("Calculando…")}</p>`);
  try {
    const r = await api("/api/reparto", { dia: payload(d), desde: ci });
    propuesta = { di, r };
    pintarPropuesta(di, ci, titulo, r);
  } catch {
    cerrarHoja(); aviso(t("Sin conexión: quedó marcado. Puedes ajustar lo que queda más tarde."));
  }
}
function pintarPropuesta(di, ci, titulo, r) {
  const d = plan.dias[di], hecho = gHecho(d);
  const est = (g, e) => e === "ok" ? t("En el rango") : e === "bajo" ? t("{g} g bajo el rango", { g: fmt(d.rango_g[0] - g) }) : t("{g} g sobre el rango", { g: fmt(g - d.rango_g[1]) });
  const cambios = {};
  for (const c of r.cambios) (cambios[c.comida] ??= []).push(c);
  const filas = Object.entries(cambios).map(([i, cs]) => {
    const cm = d.comidas[i], g = cs.reduce((s, c) => s + c.g, 0);
    const txt = cs.map((c) => `${esc(A(c.a).nombre)} ${c.g > 0 ? "+" : "−"}${cantidad(A(c.a), Math.abs(c.p - c.de))}`).join(" · ");
    return `<div class="reparto"><div class="txt">${nombreComida(cm)} · ${cm.hora}<small>${txt}</small></div>
      <span class="mono ${g < 0 ? "menos" : ""}">${g > 0 ? "+" : "−"}${fmt(Math.abs(g))} g</span>${r.en_tope.includes(cm.id) ? `<span class="tope">${t("tope")}</span>` : ""}</div>`;
  }).join("");
  $("hoja").innerHTML = `<div class="asa"></div><span class="tipo">${nombreComida(d.comidas[ci])} · ${d.comidas[ci].hora}</span>
    <h2 style="font-size:20px">${esc(titulo)}</h2>
    <p class="pista" style="margin:0">${r.cambios.length ? t("¿Lo repartimos en las comidas que vienen? Lo que ya comiste no cambia.") : t("No hay nada que mover: ya no quedan comidas por delante.")}</p>
    <div class="comparar"><div class="${r.cambios.length ? "" : "on"}"><small>${t("Dejar así")}</small><b>${fmt(r.sin)} g</b><span class="estado ${r.estado_sin}">${est(r.sin, r.estado_sin)}</span></div>

function aplicarCambios(d, cambios) {

    delete it.v;
    dg += gIt(it, it.c) - gIt(it);

  if (d.comidas[ci].items.every((it) => it.c != null)) abierta[di] = d.comidas.findIndex((cm) => !completa(cm));

function validarForm() {

async function armar() {

  if (r.derivar) { paso = 1; return pintarForm(r.mensaje); }
  plan = r; perfil = structuredClone(f); guardar("fp_perfil", perfil); guardarPlan();
  editando = false; paso = 1; diaSel = null; abierta = {};

}

// ── Lo que viaja con la cuenta (como DATOS_CUENTA de PacePath) ──────────────
// Perfil, agenda con lo marcado, agua, planes anteriores, idioma y modo noche se
// suben a la cuenta y bajan en cualquier aparato donde entres.
const DATOS_CUENTA = ["fp_perfil", "fp_plan", "fp_agua", "fp_historial", "fp_idioma", "fp_noche"];
let miCuenta = null;
const hashTexto = (x) => { let h = 5381; for (let i = 0; i < x.length; i++) h = ((h * 33) ^ x.charCodeAt(i)) >>> 0; return h.toString(36); };
const instantanea = () => { const o = {}; try { for (const k of DATOS_CUENTA) { const v = localStorage.getItem(k); if (v !== null) o[k] = v; } } catch {} return o; };
let subiendo = false;
async function subirCuenta() {
  if (!miCuenta || subiendo) return;
  const datos = instantanea(), h = hashTexto(JSON.stringify(datos));
  if (h === pref("fp_cuenta_hash", null)) return;            // nada cambió desde la última vez
  subiendo = true;
  try {
    const r = await fetch("/api/cuenta/datos", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ datos }) });
    if (r.ok) { guardar("fp_cuenta_hash", h); guardar("fp_cuenta_ts", (await r.json()).actualizado); }
  } catch {} finally { subiendo = false; }
}
async function alEntrarCuenta() {
  const de = pref("fp_cuenta_de", null);
  if (de && de !== miCuenta.id) {                              // el aparato era de otra cuenta: no se mezcla
    for (const k of [...DATOS_CUENTA, "fp_cuenta_hash", "fp_cuenta_ts", "fp_alimentos"]) borrarClave(k);
    plan = perfil = null; agua = {}; historial = [];
  }
  const j = await fetch("/api/cuenta/datos").then((r) => r.ok ? r.json() : null).catch(() => null);
  if (j && j.actualizado && (de !== miCuenta.id || j.actualizado > (pref("fp_cuenta_ts", "") || ""))) {
    // Lo de la cuenta es más nuevo (o es la primera vez aquí): manda.
    const antes = JSON.stringify(instantanea());
    for (const [k, v] of Object.entries(j.datos)) try { localStorage.setItem(k, v); } catch {}
    guardar("fp_cuenta_ts", j.actualizado); guardar("fp_cuenta_hash", hashTexto(JSON.stringify(j.datos)));
    guardar("fp_cuenta_de", miCuenta.id);
    if (JSON.stringify(instantanea()) !== antes && !sessionStorage.getItem("fp_recargada")) {
      sessionStorage.setItem("fp_recargada", "1"); location.reload(); return;
    }
  }
  guardar("fp_cuenta_de", miCuenta.id);
  subirCuenta();
  setInterval(subirCuenta, 20_000);
  document.addEventListener("visibilitychange", () => { if (document.hidden) subirCuenta(); });
}

    historial = historial.filter((h) => h.id !== Number(b.dataset.id)); guardar("fp_historial", historial); cerrarHoja(); cambiarVista(vista); },
  reusar: (b) => { const h = historial.find((x) => x.id === Number(b.dataset.id)); if (!h) return;
    form = { ...formNuevo(), ...structuredClone(h.perfil || {}), fecha: "" }; editando = !!plan; paso = 1; lista = null;
    cerrarHoja(); vista = "pauta"; for (const s2 of document.querySelectorAll("main > section")) s2.hidden = s2.id !== "v-pauta";
    for (const a of document.querySelectorAll("nav a")) a.classList.toggle("on", a.dataset.vista === "pauta"); pintarForm(); scrollTo(0, 0); },
};
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-acc]");
  if (!b || b.disabled) return;
  ACC[b.dataset.acc]?.(b, e);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (!$("capa").hidden) cerrarHoja(); else if (!$("ajuste").hidden) cerrarAjuste(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.("[role=checkbox][data-acc]")) { e.preventDefault(); e.target.click(); }
});
// Campos del formulario: se guardan en `form` al escribir; los que cambian la pantalla la repintan.
// Campos de «Agregar»: la búsqueda repinta sólo la lista (para no perder el foco).
$("hoja").addEventListener("input", (e) => {
  const k = e.target.dataset?.agr; if (!k || !agr) return;
  agr[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
  if (k === "q") $("agr-lista").innerHTML = listaAgregar();
  if (k === "cho" && $("agr-g")) $("agr-g").innerHTML = `${fmt(agr.n * (Number(String(agr.cho).replace(",", ".")) || 0))} <small>g</small>`;
});
$("pauta").addEventListener("input", (e) => {
  const k = e.target.dataset?.f; if (!k) return;
  form[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
  if (k === "peso" || k === "tiempo") {                    // actualiza los g/día del régimen sin perder el foco
    const tipo = tipoCarga(form);
    if (k === "tiempo" && form.distancia === "otra") return;
    document.querySelectorAll(".op").forEach((op, i) => { const r = REG[tipo]?.[i]?.[0], kgs = pesoKg();
      const g = op.querySelector(".g"); if (g && r) g.textContent = kgs >= 30 ? t("{g} g/día", { g: fmt(Math.round(r * kgs / 10) * 10) }) : "—"; });
  }
});
$("hoy").addEventListener("input", (e) => { const k = e.target.dataset?.fb; if (k) fb[k] = e.target.value; });
$("pauta").addEventListener("change", (e) => {
  const k = e.target.dataset?.f; if (!k) return;
  if (k === "distancia" || k === "medica" || (k === "tiempo" && form.distancia === "otra")) pintarForm();
});
$("pauta").addEventListener("submit", (e) => {
  e.preventDefault();
  const err = validarForm();
  if (err) return pintarForm(err);
  if (form.medica) return pintarForm(t("En ese caso no armamos pauta: te recomendamos verlo con un profesional"));
  paso = 2; pintarAlimentos(); scrollTo(0, 0);
});
$("borrar").onclick = () => {
  plan = perfil = form = null; agua = {}; diaSel = null; abierta = {}; editando = false; paso = 1;
  for (const k of ["fp_perfil", "fp_plan", "fp_agua", "fp_carrera", "fp_pauta", "fp_comido"]) borrarClave(k);
  cambiarVista("hoy");
};

// ── Idioma y modo noche ───────────────────────────────────────────────────
let noche = pref("fp_noche", window.matchMedia?.("(prefers-color-scheme: dark)").matches || false);
function aplicarIdioma() {
  document.documentElement.lang = idioma;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.dataset.es ??= el.textContent.trim(); el.textContent = t(el.dataset.es); });
  const sig = IDIOMAS[(IDIOMAS.indexOf(idioma) + 1) % IDIOMAS.length];
  $("botonIdioma").textContent = sig.toUpperCase();
  $("botonNoche").setAttribute("aria-label", t(noche ? "Modo día" : "Modo noche"));
}
async function traducirPlan() {      // los textos del plan vienen del servidor; lo marcado se queda como está
  if (!plan || !perfil) return;
  try {
    const f = perfil, otro = await api("/api/carga", { evento: plan.evento, fecha: plan.fecha, hora: plan.hora, peso_kg: plan.peso_kg,
      distancia: plan.distancia, km: plan.distancia === "otra" ? plan.km : null, deporte: plan.distancia === "otra" ? plan.deporte : null,
      tiempo_min: plan.tiempo_min, regimen: plan.regimen, levanta: f.levanta || "07:00", acuesta: f.acuesta || "23:00",
      primera_carga: f.primera_carga, estomago_sensible: f.estomago_sensible, sudor_salado: f.sudor_salado,
      restricciones: f.restricciones, elegidos: plan.elegidos, gel_g: Number(f.gel_g) || 25, intestino_entrenado: f.intestino });
    for (const k of ["notas", "aviso", "fuente"]) plan[k] = otro[k];
    plan.carrera.notas = otro.carrera.notas;
    plan.dias.forEach((d, i) => { if (otro.dias[i]) d.notas = otro.dias[i].notas; });
    guardarPlan();
  } catch {}
}
$("botonIdioma").onclick = async () => {
  idioma = IDIOMAS[(IDIOMAS.indexOf(idioma) + 1) % IDIOMAS.length];
  guardar("fp_idioma", idioma);
  aplicarIdioma(); lista = null;
  try { await cargarCatalogo(perfil?.restricciones || [], perfil?.estomago_sensible); } catch {}
  await traducirPlan();
  cambiarVista(vista);
};
function aplicarNoche() {
  document.body.classList.toggle("noche", noche);
  document.querySelector('meta[name="theme-color"]').content = noche ? "#141418" : "#ffffff";
  $("botonNoche").textContent = noche ? "☀" : "☾";
}
$("botonNoche").onclick = () => { noche = !noche; guardar("fp_noche", noche); aplicarNoche(); aplicarIdioma(); };

// La versión anterior guardaba otra pauta (fp_pauta): ya no sirve.
if (pref("fp_pauta", null) && !plan) for (const k of ["fp_carrera", "fp_pauta", "fp_comido"]) borrarClave(k);
if (plan && !Array.isArray(plan.dias?.[0]?.comidas)) { plan = null; borrarClave("fp_plan"); }
aplicarNoche(); aplicarIdioma(); cambiarVista("hoy");
fetch("/api/cuenta").then((r) => r.json()).then((c) => {
  miCuenta = c.usuario;
  if (vista === "perfil") pintarPerfil();
  if (miCuenta) alEntrarCuenta().catch(() => {});
}).catch(() => {});
window.addEventListener("load", () => sessionStorage.removeItem("fp_recargada"));
fetch("/api/salud").catch(() => {});            // despierta el servidor (Render gratis duerme a los 15 min)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
