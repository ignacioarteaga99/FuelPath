<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FuelPath">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Tu pauta nutricional para llegar con todo a la carrera.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>FuelPath</title>
<link rel="icon" type="image/svg+xml" href="/icons/icono.svg">
<style>
  /* Mismos tokens que PacePath (web/index.html): sólo cambia el acento si se decide otra marca. */
  :root {
    --acento: #f2541b; --acento-osc: #c9410f; --tinta: #1d1d21; --suave: #6b6b75;
    --linea: #e6e6ea; --fondo: #ffffff; --gris: #f5f5f7; --ok: #1f9d55;
    --panel: #ffffff; --sombra: rgba(0,0,0,.10);
  }
  body.noche { --tinta: #f4f4f6; --suave: #9a9aa6; --linea: #2a2a31; --gris: #22222a;
    --fondo: #141418; --panel: #141418; --sombra: rgba(0,0,0,.5); }
  @font-face { font-family: "PP Display"; src: url("/vendor/fuentes/InterDisplay-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "PP Display"; src: url("/vendor/fuentes/InterDisplay-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "PP Mono"; src: url("/vendor/fuentes/JetBrainsMono-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--fondo); color: var(--tinta);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }

  header { position: sticky; z-index: 10; top: 0; background: var(--panel);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom: 1px solid var(--linea); }
  .marca { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 19px; letter-spacing: -.3px; }
  .marca svg { width: 26px; height: 26px; }
  .marca .der { margin-left: auto; display: flex; gap: 6px; }
  .marca .der button { padding: 6px 10px; font-size: 13px; }

  main { padding: 14px 16px calc(env(safe-area-inset-bottom) + 90px); max-width: 640px; margin: 0 auto; }
  section[hidden] { display: none; }
  .tipo { color: var(--acento); font-weight: 800; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; }
  h2 { margin: 2px 0 6px; font-size: 22px; letter-spacing: -.3px; }
  .pista { color: var(--suave); margin: 4px 0 12px; }
  .aviso { background: #fff6e5; border-radius: 10px; padding: 8px 10px; color: #8a5a00; font-size: 13px; margin: 12px 0; }
  body.noche .aviso { background: #3a2a10; color: #ffd28a; }

  .tarjeta { background: var(--gris); border-radius: 16px; padding: 14px; margin: 10px 0; }
  .tarjeta h3 { margin: 0 0 4px; font-size: 16px; }
  .tarjeta ul { margin: 6px 0 0; padding-left: 18px; color: var(--suave); }
  .grande { font-family: "PP Display", -apple-system, sans-serif; font-weight: 700; font-size: 44px;
    letter-spacing: -1.5px; line-height: 1; }
  .grande small { font-size: 18px; letter-spacing: 0; color: var(--suave); }
  .mono { font-family: "PP Mono", ui-monospace, monospace; font-weight: 700; }
  .barra { height: 10px; border-radius: 5px; background: var(--linea); overflow: hidden; margin: 10px 0 4px; }
  .barra i { display: block; height: 100%; background: var(--acento); border-radius: 5px; transition: width .3s; }

  form { display: grid; gap: 10px; }
  .fila { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
  label { display: grid; gap: 4px; font-size: 12px; font-weight: 700; color: var(--suave); }
  /* 16 px: con menos, Safari iOS hace zoom al enfocar. */
  input, select { font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 12px; min-width: 0; width: 100%;
    border: 1px solid var(--linea); background: var(--gris); color: var(--tinta); }
  input:focus, select:focus { outline: 2px solid #f7c5b2; background: var(--panel); }
  .interruptor { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--tinta); }
  .interruptor input { width: 22px; height: 22px; accent-color: var(--acento); }
  button { font: inherit; font-size: 16px; border: 0; border-radius: 12px; padding: 11px 16px;
    font-weight: 700; background: var(--acento); color: #fff; cursor: pointer; white-space: nowrap; }
  button:active { background: var(--acento-osc); }
  button.sec { background: var(--gris); color: var(--tinta); border: 1px solid var(--linea); }
  .botones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .gel { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--linea); }
  .gel:last-child { border-bottom: 0; }
  .gel .mono { min-width: 64px; color: var(--acento); }

  nav { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; background: var(--panel);
    border-top: 1px solid var(--linea); display: flex; padding: 6px 0 calc(env(safe-area-inset-bottom) + 6px); }
  nav a { flex: 1; text-align: center; color: var(--suave); font-size: 11px; font-weight: 600; text-decoration: none; }
  nav a svg { width: 24px; height: 24px; display: block; margin: 0 auto 2px; }
  nav a.on { color: var(--acento); }
  body.noche nav a.on { color: #ff6a2b; }
</style>
</head>
<body>
<header>
  <div class="marca">
    <svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#f2541b"/>
      <path d="M13 5.5c3 3.6 5 6.4 5 9a5 5 0 0 1-10 0c0-2.6 2-5.4 5-9z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M11 15.5a2.2 2.2 0 0 0 2 2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
    FuelPath
    <span class="der"><button class="sec" id="botonIdioma" type="button">EN</button>
      <button class="sec" id="botonNoche" type="button" aria-label="Modo noche">☾</button></span>
  </div>
</header>

<main>
  <section id="v-hoy">
    <div id="hoy"></div>
  </section>

  <section id="v-pauta" hidden>
    <span class="tipo" data-i18n>Mi carrera</span>
    <h2 data-i18n>Arma tu pauta</h2>
    <p class="pista" data-i18n>Con tu peso, la carrera y la hora de salida calculamos la carga de carbohidratos, la comida previa y el plan en carrera.</p>
    <form id="form">
      <label><span data-i18n>Nombre de la carrera</span><input id="f-nombre" placeholder="Maratón de Santiago" autocomplete="off"></label>
      <div class="fila">
        <label><span data-i18n>Fecha</span><input id="f-fecha" type="date" required></label>
        <label><span data-i18n>Hora de salida</span><input id="f-hora" type="time" value="08:00" required></label>
      </div>
      <div class="fila">
        <label><span data-i18n>Distancia (km)</span>
          <select id="f-dist"><option value="5">5K</option><option value="10">10K</option><option value="21.1">21K</option>
            <option value="42.2" selected>42K</option><option value="50">50K</option></select></label>
        <label><span data-i18n>Tiempo estimado</span><input id="f-tiempo" placeholder="3:30" inputmode="numeric" required></label>
      </div>
      <div class="fila">
        <label><span data-i18n>Peso (kg)</span><input id="f-peso" type="number" inputmode="decimal" min="30" max="200" step="0.5" required></label>
        <label><span data-i18n>Carbohidratos por gel (g)</span><input id="f-gel" type="number" inputmode="numeric" value="25" min="5" max="100"></label>
      </div>
      <label class="interruptor"><input id="f-intestino" type="checkbox"><span data-i18n>Ya probé más de 60 g por hora en mis fondos</span></label>
      <button type="submit" data-i18n>Calcular mi pauta</button>
    </form>
    <div id="pauta"></div>
  </section>

  <section id="v-carrera" hidden>
    <div id="carrera"></div>
  </section>

  <section id="v-perfil" hidden>
    <span class="tipo" data-i18n>Perfil</span>
    <h2 data-i18n>Tus datos</h2>
    <p class="pista" data-i18n>Por ahora todo se guarda en este teléfono. Con cuenta (pronto) se sincroniza entre tus aparatos.</p>
    <div class="botones"><button class="sec" id="borrar" type="button" data-i18n>Borrar mi pauta</button></div>
  </section>
</main>

<nav>
  <a class="on" href="#" data-vista="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span data-i18n>Hoy</span></a>
  <a href="#" data-vista="pauta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg><span data-i18n>Pauta</span></a>
  <a href="#" data-vista="carrera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span data-i18n>Carrera</span></a>
  <a href="#" data-vista="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-i18n>Perfil</span></a>
</nav>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function pref(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }
function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

// ── Idiomas (mismo esquema que PacePath: clave = texto en español) ─────────
const IDIOMAS = ["es", "en", "pt"];
const LOCALE = { es: "es-CL", en: "en-US", pt: "pt-BR" };
let idioma = pref("fp_idioma", IDIOMAS.includes(navigator.language.slice(0, 2)) ? navigator.language.slice(0, 2) : "es");
const EN = {
  "Mi carrera": "My race", "Arma tu pauta": "Build your plan", "Hoy": "Today", "Pauta": "Plan", "Carrera": "Race",
  "Perfil": "Profile", "Tus datos": "Your data",
  "Con tu peso, la carrera y la hora de salida calculamos la carga de carbohidratos, la comida previa y el plan en carrera.":
    "With your weight, the race and the start time we work out your carb load, pre-race meal and race-day fuelling.",
  "Nombre de la carrera": "Race name", "Fecha": "Date", "Hora de salida": "Start time", "Distancia (km)": "Distance (km)",
  "Tiempo estimado": "Estimated time", "Peso (kg)": "Weight (kg)", "Carbohidratos por gel (g)": "Carbs per gel (g)",
  "Ya probé más de 60 g por hora en mis fondos": "I've already tried more than 60 g per hour on long runs",
  "Calcular mi pauta": "Work out my plan", "Borrar mi pauta": "Delete my plan",
  "Por ahora todo se guarda en este teléfono. Con cuenta (pronto) se sincroniza entre tus aparatos.":
    "For now everything is saved on this phone. With an account (soon) it syncs across your devices.",
  "Aún no tienes pauta": "No plan yet", "Arma tu pauta en la pestaña Pauta con tu carrera y tu peso.":
    "Build your plan in the Plan tab with your race and your weight.", "Armar mi pauta": "Build my plan",
  "Faltan {n} días para {c}": "{n} days to {c}", "Hoy es {c}": "Today is {c}", "Carbohidratos de hoy": "Today's carbs",
  "Llevas {g} g": "{g} g so far", "Hoy come normal": "Eat normally today", "Comida previa": "Pre-race meal",
  "{h} h antes, a las {t}": "{h} h before, at {t}", "Durante la carrera": "During the race",
  "por hora": "per hour", "líquido": "fluid", "sodio": "sodium", "Geles": "Gels", "min": "min",
  "Sin geles: en esta distancia basta con lo que comiste antes.": "No gels: at this distance what you ate beforehand is enough.",
  "Total en carrera: {g} g": "Total during the race: {g} g", "Tiempo como 3:30 o 45:00": "Time like 3:30 or 45:00",
  "No pude calcular la pauta.": "I couldn't work out the plan.", "Modo noche": "Night mode", "Modo día": "Day mode",
  "La carrera ya pasó.": "The race is over.",
};
const PT = {
  "Mi carrera": "Minha prova", "Arma tu pauta": "Monte seu plano", "Hoy": "Hoje", "Pauta": "Plano", "Carrera": "Prova",
  "Perfil": "Perfil", "Tus datos": "Seus dados",
  "Con tu peso, la carrera y la hora de salida calculamos la carga de carbohidratos, la comida previa y el plan en carrera.":
    "Com seu peso, a prova e o horário da largada calculamos a carga de carboidratos, a refeição pré-prova e o plano na prova.",
  "Nombre de la carrera": "Nome da prova", "Fecha": "Data", "Hora de salida": "Largada", "Distancia (km)": "Distância (km)",
  "Tiempo estimado": "Tempo estimado", "Peso (kg)": "Peso (kg)", "Carbohidratos por gel (g)": "Carboidratos por gel (g)",
  "Ya probé más de 60 g por hora en mis fondos": "Já testei mais de 60 g por hora nos longões",
  "Calcular mi pauta": "Calcular meu plano", "Borrar mi pauta": "Apagar meu plano",
  "Por ahora todo se guarda en este teléfono. Con cuenta (pronto) se sincroniza entre tus aparatos.":
    "Por enquanto tudo fica salvo neste celular. Com conta (em breve) sincroniza entre seus aparelhos.",
  "Aún no tienes pauta": "Você ainda não tem plano", "Arma tu pauta en la pestaña Pauta con tu carrera y tu peso.":
    "Monte seu plano na aba Plano com sua prova e seu peso.", "Armar mi pauta": "Montar meu plano",
  "Faltan {n} días para {c}": "Faltam {n} dias para {c}", "Hoy es {c}": "Hoje é {c}", "Carbohidratos de hoy": "Carboidratos de hoje",
  "Llevas {g} g": "Você já comeu {g} g", "Hoy come normal": "Hoje coma normalmente", "Comida previa": "Refeição pré-prova",
  "{h} h antes, a las {t}": "{h} h antes, às {t}", "Durante la carrera": "Durante a prova",
  "por hora": "por hora", "líquido": "líquido", "sodio": "sódio", "Geles": "Géis", "min": "min",
  "Sin geles: en esta distancia basta con lo que comiste antes.": "Sem géis: nessa distância basta o que você comeu antes.",
  "Total en carrera: {g} g": "Total na prova: {g} g", "Tiempo como 3:30 o 45:00": "Tempo como 3:30 ou 45:00",
  "No pude calcular la pauta.": "Não consegui calcular o plano.", "Modo noche": "Modo noite", "Modo día": "Modo dia",
  "La carrera ya pasó.": "A prova já passou.",
};
function t(es, vars) {
  let s = idioma === "en" ? (EN[es] ?? es) : idioma === "pt" ? (PT[es] ?? EN[es] ?? es) : es;
  if (vars) s = s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
  return s;
}
// Toda llamada a la API lleva el idioma: el servidor responde en él.
const _fetch = window.fetch.bind(window);
window.fetch = (u, o = {}) => _fetch(u, { ...o, headers: { ...(o.headers || {}), "X-Idioma": idioma } });

// ── Estado (en el teléfono; luego viaja con la cuenta, como DATOS_CUENTA de PacePath) ──
// fp_carrera: lo que pidió el usuario · fp_pauta: la respuesta del servidor · fp_comido: {fecha: gramos}
let carrera = pref("fp_carrera", null), datos = pref("fp_pauta", null), comido = pref("fp_comido", {});
let vista = "hoy";
const hoyISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const diasHasta = (iso) => Math.round((new Date(iso + "T12:00") - new Date(hoyISO() + "T12:00")) / 86400000);
const fechaLarga = (iso) => new Date(iso + "T12:00").toLocaleDateString(LOCALE[idioma], { weekday: "long", day: "numeric", month: "short" });
const rango = (r, u = "g") => r ? (r[0] === r[1] ? `${r[0]} ${u}` : `${r[0]}–${r[1]} ${u}`) : "–";

function minutos(txt) {           // «3:30» → 210 · «45:00» → 45 · «45» → 45
  const p = String(txt).trim().split(/[:.,h]/).map(Number);
  if (p.some(isNaN) || !p[0]) return null;
  if (p.length === 1) return p[0];
  return p[0] < 10 ? p[0] * 60 + p[1] : p[0] + p[1] / 60;
}

async function calcular(c) {
  const r = await fetch("/api/pauta", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ peso_kg: c.peso, distancia_km: c.dist, tiempo_min: c.min, fecha: c.fecha, hora: c.hora,
                           gel_g: c.gel, intestino_entrenado: c.intestino }) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || t("No pude calcular la pauta."));
  return r.json();
}

// ── Vistas ────────────────────────────────────────────────────────────────
function sinPauta() {
  return `<span class="tipo">FuelPath</span><h2>${t("Aún no tienes pauta")}</h2>
    <p class="pista">${t("Arma tu pauta en la pestaña Pauta con tu carrera y tu peso.")}</p>
    <button type="button" onclick="cambiarVista('pauta')">${t("Armar mi pauta")}</button>`;
}

function pintarHoy() {
  if (!datos) return $("hoy").innerHTML = sinPauta();
  const n = diasHasta(carrera.fecha), nombre = esc(carrera.nombre || `${carrera.dist}K`);
  if (n < 0) return $("hoy").innerHTML = `<h2>${nombre}</h2><p class="pista">${t("La carrera ya pasó.")}</p>`;
  const dia = datos.dias.find((d) => d.fecha === hoyISO());
  let h = `<span class="tipo">${n === 0 ? t("Hoy es {c}", { c: nombre }) : t("Faltan {n} días para {c}", { n, c: nombre })}</span>
    <h2>${esc(fechaLarga(hoyISO()))}</h2>`;
  if (n === 0) {                     // día de carrera: la comida previa y el plan, a la vista
    $("hoy").innerHTML = h + `<div class="tarjeta"><h3>${t("Comida previa")}</h3>
      ${datos.previa.opciones.map((o) => `<p>${t("{h} h antes, a las {t}", { h: o.horas_antes, t: o.hora })} · ${rango(o.carbo_g)}</p>`).join("")}</div>
      <button type="button" onclick="cambiarVista('carrera')">${t("Durante la carrera")}</button>`;
    return;
  }
  if (dia?.carbo_g) {
    const g = comido[hoyISO()] || 0, pct = Math.min(100, g / dia.carbo_g[0] * 100);
    h += `<div class="tarjeta"><h3>${t("Carbohidratos de hoy")}</h3>
      <div class="grande">${g}<small> / ${rango(dia.carbo_g)}</small></div>
      <div class="barra"><i style="width:${pct.toFixed(0)}%"></i></div>
      <div class="botones">${[25, 50, 100].map((x) => `<button class="sec" type="button" onclick="sumar(${x})">+${x} g</button>`).join("")}
        <button class="sec" type="button" onclick="sumar(-25)">−25 g</button></div>
      <ul>${dia.notas.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  } else {
    h += `<div class="tarjeta"><h3>${t("Hoy come normal")}</h3><ul>${(dia?.notas || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  }
  $("hoy").innerHTML = h;
}
function sumar(g) {
  const k = hoyISO();
  comido[k] = Math.max(0, (comido[k] || 0) + g);
  guardar("fp_comido", comido);
  pintarHoy();
}

function pintarPauta() {
  if (!datos) return $("pauta").innerHTML = "";
  $("pauta").innerHTML = datos.dias.map((d) => `<div class="tarjeta"><span class="tipo">${esc(d.etiqueta)}</span>
      <h3>${esc(fechaLarga(d.fecha))} · ${d.carbo_g ? rango(d.carbo_g) : t("Hoy come normal")}</h3>
      <ul>${d.notas.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")
    + `<div class="tarjeta"><span class="tipo">${t("Comida previa")}</span>
      ${datos.previa.opciones.map((o) => `<h3>${t("{h} h antes, a las {t}", { h: o.horas_antes, t: o.hora })} · ${rango(o.carbo_g)}</h3>`).join("")}
      <ul>${datos.previa.notas.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>
    <p class="aviso">${esc(datos.aviso)}</p>`;
}

function pintarCarrera() {
  if (!datos) return $("carrera").innerHTML = sinPauta();
  const r = datos.carrera;
  $("carrera").innerHTML = `<span class="tipo">${t("Durante la carrera")}</span><h2>${esc(carrera.nombre || `${carrera.dist}K`)}</h2>
    <div class="tarjeta"><div class="grande">${rango(r.carbo_g_h)}<small> ${t("por hora")}</small></div>
      <p class="pista">${r.liquido_ml_h ? `${rango(r.liquido_ml_h, "ml")} ${t("líquido")}` : ""}${r.sodio_mg_h ? ` · ${rango(r.sodio_mg_h, "mg")} ${t("sodio")}` : ""}</p></div>
    <div class="tarjeta"><h3>${t("Geles")}</h3>
      ${r.geles.length ? r.geles.map((g) => `<div class="gel"><span class="mono">${g.min} ${t("min")}</span><span>km ${Number(g.km).toLocaleString(LOCALE[idioma])}</span></div>`).join("")
        + `<p class="pista">${t("Total en carrera: {g} g", { g: r.total_carbo_g })}</p>`
        : `<p class="pista">${t("Sin geles: en esta distancia basta con lo que comiste antes.")}</p>`}
      <ul>${r.notas.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
}

function cambiarVista(v) {
  vista = v;
  for (const s of document.querySelectorAll("main > section")) s.hidden = s.id !== `v-${v}`;
  for (const a of document.querySelectorAll("nav a")) a.classList.toggle("on", a.dataset.vista === v);
  ({ hoy: pintarHoy, pauta: pintarPauta, carrera: pintarCarrera })[v]?.();
  scrollTo(0, 0);
}
for (const a of document.querySelectorAll("nav a")) a.onclick = (e) => { e.preventDefault(); cambiarVista(a.dataset.vista); };

// ── Formulario ────────────────────────────────────────────────────────────
function llenarForm() {
  if (!carrera) return;
  $("f-nombre").value = carrera.nombre || ""; $("f-fecha").value = carrera.fecha; $("f-hora").value = carrera.hora;
  $("f-dist").value = String(carrera.dist); $("f-peso").value = carrera.peso; $("f-gel").value = carrera.gel;
  $("f-intestino").checked = carrera.intestino;
  const m = Math.round(carrera.min);
  $("f-tiempo").value = m >= 60 ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}` : `${m}:00`;
}
$("form").onsubmit = async (e) => {
  e.preventDefault();
  const min = minutos($("f-tiempo").value);
  if (!min) { $("f-tiempo").setCustomValidity(t("Tiempo como 3:30 o 45:00")); $("f-tiempo").reportValidity(); return; }
  const c = { nombre: $("f-nombre").value.trim(), fecha: $("f-fecha").value, hora: $("f-hora").value,
              dist: Number($("f-dist").value), min, peso: Number($("f-peso").value), gel: Number($("f-gel").value) || 25,
              intestino: $("f-intestino").checked };
  try {
    datos = await calcular(c); carrera = c;
    guardar("fp_carrera", carrera); guardar("fp_pauta", datos);
    pintarPauta();
    $("pauta").scrollIntoView({ behavior: "smooth" });
  } catch (err) { $("pauta").innerHTML = `<p class="aviso">${esc(err.message)}</p>`; }
};
$("f-tiempo").oninput = () => $("f-tiempo").setCustomValidity("");
$("borrar").onclick = () => {
  carrera = datos = null; comido = {};
  for (const k of ["fp_carrera", "fp_pauta", "fp_comido"]) try { localStorage.removeItem(k); } catch {}
  $("form").reset(); cambiarVista("hoy");
};

// ── Idioma y modo noche ───────────────────────────────────────────────────
let noche = pref("fp_noche", window.matchMedia?.("(prefers-color-scheme: dark)").matches || false);
function aplicarIdioma() {
  document.documentElement.lang = idioma;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.dataset.es ??= el.textContent.trim(); el.textContent = t(el.dataset.es); });
  const sig = IDIOMAS[(IDIOMAS.indexOf(idioma) + 1) % IDIOMAS.length];
  $("botonIdioma").textContent = sig.toUpperCase();
  $("botonNoche").setAttribute("aria-label", t(noche ? "Modo día" : "Modo noche"));
}
$("botonIdioma").onclick = async () => {
  idioma = IDIOMAS[(IDIOMAS.indexOf(idioma) + 1) % IDIOMAS.length];
  guardar("fp_idioma", idioma);
  aplicarIdioma();
  if (carrera) try { datos = await calcular(carrera); guardar("fp_pauta", datos); } catch {}   // los textos vienen del servidor
  cambiarVista(vista);
};
function aplicarNoche() {
  document.body.classList.toggle("noche", noche);
  document.querySelector('meta[name="theme-color"]').content = noche ? "#141418" : "#ffffff";
  $("botonNoche").textContent = noche ? "☀" : "☾";
}
$("botonNoche").onclick = () => { noche = !noche; guardar("fp_noche", noche); aplicarNoche(); aplicarIdioma(); };

aplicarNoche(); aplicarIdioma(); llenarForm(); cambiarVista("hoy");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
